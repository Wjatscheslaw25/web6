<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание №6 (Юрьев Вячеслав, ПИ-21-1)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form id="calc-form">
        <!-- Поле для ввода количества -->
        <label>Количество:
            <input type="number" id="amount" name="amount" value="1" min="1">
        </label>

        <!-- Выбор типа услуги радиокнопкой (3 варианта) -->
        <div class="radio-group">
            <p>Тип услуги:</p>
            <label><input type="radio" name="serviceType" value="1" checked> Тип 1</label>
            <label><input type="radio" name="serviceType" value="2"> Тип 2</label>
            <label><input type="radio" name="serviceType" value="3"> Тип 3</label>
        </div>

        <!-- Опция товара селектом (для 2 типа) -->
        <div id="select-div" class="options-box" style="display: none;">
            <label>Опция товара (для Типа 2):
                <select name="serviceOption" id="serviceOption">
                    <option value="opt1">Опция А (+50 руб)</option>
                    <option value="opt2">Опция Б (+100 руб)</option>
                </select>
            </label>
        </div>

        <!-- Свойство товара чекбоксом (для 3 типа) -->
        <div id="checkbox-div" class="options-box" style="display: none;">
            <label>
                <input type="checkbox" name="serviceProperty" id="serviceProperty" value="prop1"> Свойство товара (для Типа 3, +150 руб)
            </label>
        </div>

        <h2>Итого: <span id="price">0</span> рублей</h2>
    </form>

    <script src="my.js"></script>
</body>
</html>
