<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание №6 (Юрьев Вячеслав, ПИ-21-1)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Простая шапка -->
    <header class="header">
        <div class="header-container">
            <span class="author">Юрьев Вячеслав</span>
            <span class="task-title">Задание №6</span>
        </div>
    </header>

    <!-- Центрированный калькулятор -->
    <main class="page-container">
        <div class="calc-card">
            <h2>Калькулятор стоимости услуг</h2>
            
            <form id="calc-form">
                <!-- Количество -->
                <div class="form-group">
                    <label for="amount">Количество проектов:</label>
                    <input type="number" id="amount" name="amount" value="1" min="1">
                </div>

                <!-- Выбор типа услуги (3 варианта радиокнопками) -->
                <div class="form-group">
                    <label>Тип услуги:</label>
                    <div class="radio-box">
                        <label><input type="radio" name="serviceType" value="1" checked> Лендинг (15 000 ₽)</label>
                        <label><input type="radio" name="serviceType" value="2"> Корпоративный сайт (35 000 ₽)</label>
                        <label><input type="radio" name="serviceType" value="3"> Интернет-магазин (60 000 ₽)</label>
                    </div>
                </div>

                <!-- Опция товара селектом (для 2 типа) -->
                <div id="select-div" class="form-group option-box" style="display: none;">
                    <label for="serviceOption">Дизайн-оформление (для Типа 2):</label>
                    <select name="serviceOption" id="serviceOption">
                        <option value="opt1">Стандартный дизайн (+5 000 ₽)</option>
                        <option value="opt2">Эксклюзивный UI/UX дизайн (+15 000 ₽)</option>
                    </select>
                </div>

                <!-- Свойство товара чекбоксом (для 3 типа) -->
                <div id="checkbox-div" class="form-group option-box" style="display: none;">
                    <label class="checkbox-label">
                        <input type="checkbox" name="serviceProperty" id="serviceProperty" value="prop1"> Интеграция с платежной системой (для Типа 3, +20 000 ₽)
                    </label>
                </div>

                <!-- Итоговая стоимость -->
                <div class="result-box">
                    <h3>Итого: <span id="price">15000</span> ₽</h3>
                </div>
            </form>
        </div>
    </main>

    <script src="my.js"></script>
</body>
</html>
